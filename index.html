<script>

const state={

money:1000,
visitors:0,
robots:1,

cameraX:0,
cameraY:0,

zoom:1

};

const world=document.getElementById("world");
const camera=document.getElementById("camera");

function updateHUD(){

document.getElementById("money").textContent=
state.money.toLocaleString("pt-BR");

document.getElementById("visitors").textContent=
state.visitors;

document.getElementById("robots").textContent=
state.robots;

}

updateHUD();

/* câmera */

let drag=false;

let sx=0;
let sy=0;

camera.onmousedown=e=>{

drag=true;

sx=e.clientX;
sy=e.clientY;

camera.style.cursor="grabbing";

};

window.onmouseup=()=>{

drag=false;

camera.style.cursor="grab";

};

window.onmousemove=e=>{

if(!drag)return;

state.cameraX+=e.clientX-sx;
state.cameraY+=e.clientY-sy;

sx=e.clientX;
sy=e.clientY;

world.style.transform=
`translate(${state.cameraX}px,${state.cameraY}px) scale(${state.zoom})`;

};

camera.onwheel=e=>{

e.preventDefault();

state.zoom+=e.deltaY<0?0.1:-0.1;

if(state.zoom<0.5)state.zoom=0.5;
if(state.zoom>2)state.zoom=2;

world.style.transform=
`translate(${state.cameraX}px,${state.cameraY}px) scale(${state.zoom})`;

};/* ===========================
   VISITANTES
=========================== */

const visitors=[];

function spawnVisitor(){

const v=document.createElement("div");

v.className="visitor";

v.x=1950+Math.random()*100;
v.y=1950+Math.random()*100;

v.style.left=v.x+"px";
v.style.top=v.y+"px";

world.appendChild(v);

visitors.push(v);

state.visitors++;

updateHUD();

let angle=Math.random()*Math.PI*2;

setInterval(()=>{

angle+=(Math.random()-0.5)*0.3;

v.x+=Math.cos(angle)*2;
v.y+=Math.sin(angle)*2;

if(v.x<20)v.x=20;
if(v.y<20)v.y=20;
if(v.x>3980)v.x=3980;
if(v.y>3980)v.y=3980;

v.style.left=v.x+"px";
v.style.top=v.y+"px";

},40);

}

setInterval(()=>{

if(state.visitors<150){

spawnVisitor();

}

},1200);

/* ===========================
   ROBÔS
=========================== */

const robots=[];

function hireRobot(){

const cost=500;

if(state.money<cost){

alert("Dinheiro insuficiente!");

return;

}

state.money-=cost;

state.robots++;

updateHUD();

const r=document.createElement("div");

r.className="robot";

r.x=2000;
r.y=2000;

r.style.left=r.x+"px";
r.style.top=r.y+"px";

world.appendChild(r);

robots.push(r);

let dir=Math.random()*Math.PI*2;

setInterval(()=>{

dir+=(Math.random()-0.5)*0.4;

r.x+=Math.cos(dir)*3;
r.y+=Math.sin(dir)*3;

if(r.x<20)r.x=20;
if(r.y<20)r.y=20;
if(r.x>3980)r.x=3980;
if(r.y>3980)r.y=3980;

r.style.left=r.x+"px";
r.style.top=r.y+"px";

},35);

}

/* ===========================
   ECONOMIA
=========================== */

function collectMoney(){

let gain=Math.floor(

state.visitors*6+

state.robots*20

);

state.money+=gain;

updateHUD();

}

setInterval(()=>{

state.money+=Math.floor(

state.visitors*2+

state.robots*4

);

updateHUD();

},1000);

/* ===========================
   CONSTRUIR ATRAÇÕES
=========================== */

function buildRide(){

const cost=1000;

if(state.money<cost){

alert("Você não tem dinheiro!");

return;

}

state.money-=cost;

updateHUD();

const emojis=[
"🎠",
"🎢",
"🎡",
"🚀",
"🛸",
"🎪"
];

const ride=document.createElement("div");

ride.className="ride";

ride.innerHTML=
emojis[Math.floor(Math.random()*emojis.length)];

ride.style.left=
(150+Math.random()*3600)+"px";

ride.style.top=
(150+Math.random()*3600)+"px";

ride.style.background=
"#"+Math.floor(Math.random()*16777215).toString(16).padStart(6,"0");

ride.level=1;

ride.onclick=function(){

const lucro=ride.level*300;

state.money+=lucro;

updateHUD();

};

ride.ondblclick=function(){

const upgrade=ride.level*1500;

if(state.money<upgrade){

return;

}

state.money-=upgrade;

ride.level++;

ride.style.transform=
"scale("+(1+ride.level*0.08)+")";

updateHUD();

};

world.appendChild(ride);

}

=========================== */

"Galaxy Park Tycoon | 💰 "+
state.money.toLocaleString("pt-BR");

},500);/* ===========================

=========================== */

};

let time=300;

const timer=setInterval(()=>{

clearInterval(timer);

events[type]=false;

notify("Evento encerrado!");

}

},1000);

switch(type){

notify("💰 Evento 2X Money iniciado!");

case "people5x":

for(let i=0;i<80;i++){

}

break;

case "treasure":

notify("💎 Evento do Tesouro iniciado!");

break;

}

}

function saveGameFull(){

const save={

state,

rides:rides.map(r=>({

emoji:r.innerHTML,

left:r.style.left,

top:r.style.top,

background:r.style.background,

level:r.level,

income:r.income

})),

buildings:buildings.map(b=>({

emoji:b.innerHTML,

left:b.style.left,

top:b.style.top,

background:b.style.background,

level:b.level,

income:b.income

})),

achievements,

events

};

localStorage.setItem(

"GalaxyParkTycoon_Save",

JSON.stringify(save)

);

}

function loadGameFull(){

const txt=localStorage.getItem("GalaxyParkTycoon_Save");

if(!txt)return;

const save=JSON.parse(txt);

/* Estado */

Object.assign(state,save.state);

updateHUD();

if(typeof updateLevel==="function")updateLevel();
if(typeof updateHappiness==="function")updateHappiness();

/* Atrações */

rides.length=0;

save.rides.forEach(data=>{

const r=document.createElement("div");

r.className="ride";

r.innerHTML=data.emoji;

r.style.left=data.left;

r.style.top=data.top;

r.style.background=data.background;

r.level=data.level;

r.income=data.income;

r.onclick=function(){

let gain=r.level*r.income;

if(events.money2x)gain*=2;

if(events.money5x)gain*=5;

if(events.treasure)gain*=2;

state.money+=gain;

updateHUD();

};

world.appendChild(r);

rides.push(r);

});

/* Lojas */

buildings.length=0;

save.buildings.forEach(data=>{

const b=document.createElement("div");

b.className="ride";

b.innerHTML=data.emoji;

b.style.left=data.left;

b.style.top=data.top;

b.style.background=data.background;

b.level=data.level;

b.income=data.income;

world.appendChild(b);

buildings.push(b);

});

/* Conquistas */

achievements.length=0;

save.achievements.forEach(a=>{

achievements.push(a);

});

/* Eventos */

Object.assign(events,save.events);

notify("💾 Jogo carregado!");

}

setInterval(saveGameFull,10000);

window.addEventListener("load",loadGameFull);

/* ===========================
   BOTÕES
=========================== */

const saveBtn=document.createElement("button");

saveBtn.innerHTML="💾 Salvar";

saveBtn.onclick=saveGameFull;

document.getElementById("menu").appendChild(saveBtn);

const loadBtn=document.createElement("button");

loadBtn.innerHTML="📂 Carregar";

loadBtn.onclick=loadGameFull;

document.getElementById("menu").appendChild(loadBtn);/* ===========================
   SISTEMA DE ÁUDIO
=========================== */

const audio={

enabled:true,

music:new Audio("assets/music/theme.mp3"),

click:new Audio("assets/sounds/click.mp3"),

money:new Audio("assets/sounds/money.mp3"),

event:new Audio("assets/sounds/event.mp3"),

disaster:new Audio("assets/sounds/disaster.mp3")

};

audio.music.loop=true;
audio.music.volume=0.35;

function playMusic(){

if(audio.enabled){

audio.music.play().catch(()=>{});

}

}

function stopMusic(){

audio.music.pause();

}

function playSound(name){

if(!audio.enabled)return;

if(audio[name]){

audio[name].currentTime=0;

audio[name].play().catch(()=>{});

}

}

/* ===========================
   BOTÃO
=========================== */

const soundBtn=document.createElement("button");

soundBtn.innerHTML="🎵 Música ON";

soundBtn.onclick=function(){

audio.enabled=!audio.enabled;

if(audio.enabled){

playMusic();

soundBtn.innerHTML="🎵 Música ON";

}else{

stopMusic();

soundBtn.innerHTML="🔇 Música OFF";

}

};

document.getElementById("menu").appendChild(soundBtn);

/* ===========================
   EFEITOS
=========================== */

const oldCollectMoney=collectMoney;

collectMoney=function(){

playSound("money");

oldCollectMoney();

};

const oldNotify=notify;

notify=function(text){

playSound("event");

oldNotify(text);

};

const oldStartDisaster=startDisaster;

startDisaster=function(){

playSound("disaster");

oldStartDisaster();

};

document.body.addEventListener("click",playMusic,{once:true});

/* ===========================
   AMBIENTE
=========================== */

setInterval(()=>{

if(state.weather==="🌧️ Chuva"){

audio.music.volume=0.20;

}else if(state.weather==="⛈️ Tempestade"){

audio.music.volume=0.15;

}else{

audio.music.volume=0.35;

}

},2000);

console.log("Sistema de áudio carregado!");
</script>
